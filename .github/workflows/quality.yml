name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://devtreck:ci-disposable@127.0.0.1:5432/devtreck_test
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: devtreck
          POSTGRES_PASSWORD: ci-disposable
          POSTGRES_DB: devtreck_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devtreck -d devtreck_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy app
      - run: python -m pytest
      - run: python -m ruff check ../../scripts
      - run: python -m ruff format --check ../../scripts
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql+psycopg://devtreck:ci-disposable@127.0.0.1:5432/devtreck_test
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: devtreck
          POSTGRES_PASSWORD: ci-disposable
          POSTGRES_DB: devtreck_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devtreck -d devtreck_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r apps/api/requirements.lock
      - run: npm ci --prefix apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: python apps/api/scripts/browser_checks.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: apps/web/test-results
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r apps/api/requirements.lock
      - run: npm ci --prefix apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: python scripts/release_env.py
      - run: docker compose --env-file deploy/.env.release -f deploy/compose.release.yaml build
      - run: docker compose --env-file deploy/.env.release -f deploy/compose.release.yaml up -d --wait --wait-timeout 180
      - run: python scripts/recovery_drill.py
      - run: python scripts/release_checks.py
      - run: npx playwright test --config playwright.release.config.ts
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-failure-evidence
          path: apps/web/test-results
      - run: docker compose --env-file deploy/.env.release -f deploy/compose.release.yaml down
        if: always()
