name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://devtreck:ci-disposable@127.0.0.1:5432/devtreck_test
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: devtreck
          POSTGRES_PASSWORD: ci-disposable
          POSTGRES_DB: devtreck_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devtreck -d devtreck_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy app
      - run: python -m pytest
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
