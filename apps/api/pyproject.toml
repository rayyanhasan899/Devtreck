[project]
name = "devtreck-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "pydantic-settings==2.16.2", "sqlalchemy==2.1.8", "alembic==1.20.1", "psycopg[binary]==3.3.8", "argon2-cffi==25.1.0", "email-validator==2.3.0", "tzdata==2026.6"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = ["pytest==9.2.0", "httpx2==2.16.0", "ruff==0.17.4", "mypy==2.4.1"]
