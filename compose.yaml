name: devtreck
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: devtreck
      POSTGRES_DB: devtreck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:${DEV_DB_PORT:-5433}:5432"]
    volumes: ["dev_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devtreck -d devtreck"]
      interval: 5s
      timeout: 3s
      retries: 12
  db-test:
    image: postgres:18.6
    profiles: [test]
    environment:
      POSTGRES_USER: devtreck
      POSTGRES_DB: devtreck_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:${TEST_DB_PORT:-5434}:5432"]
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devtreck -d devtreck_test"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  dev_data:
